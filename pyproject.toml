description = "Codebase for https://arxiv.org/abs/2605.09495"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "log-lammps-reader>=0.4.0",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "optuna>=4.8.0",
    "pandas>=3.0.3",
    "polars>=1.43.0",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torch-geometric>=2.7.0",
    "torchopt>=0.7.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
